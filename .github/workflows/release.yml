name: Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write

jobs:
  # Job 0: resolve version
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.res.outputs.version }}
      is_release: ${{ steps.res.outputs.is_release }}
    steps:
      - name: Resolve version
        id: res
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # Job 1: Build and package
  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Lua
        uses: lua/setup-lua@v2
        with:
          lua-version: '5.4'

      - name: Validate project
        run: lua scripts/validate.lua

      - name: Generate manifest
        run: lua scripts/generate-manifest.lua

      - name: Package
        run: |
          mkdir -p build
          tar -czf cdin-x-${{ needs.version.outputs.version }}.tar.gz \
            --exclude='.git' --exclude='build' .
          echo "Package created"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdin-x-package
          path: cdin-x-*.tar.gz
          retention-days: 7

  # Job 2: Create Release (tags only)
  create-release:
    name: Create Release
    needs: [version, build]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: cdin-x-package
          merge-multiple: true

      - name: Extract release notes
        id: extract_notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          if [ -f CHANGELOG.md ] && grep -q "## \\[${VERSION}\\]" CHANGELOG.md; then
            sed -n "/## \\[${VERSION}\\]/,/## \\[/p" CHANGELOG.md | sed '$d' > release_notes.md
          else
            echo "Release ${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> release_notes.md
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.version.outputs.version }}
          body_path: release_notes.md
          files: binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
