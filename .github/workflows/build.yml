name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Job 1: quality gate — same checks local hooks run
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Lua
        uses: lua/setup-lua@v2
        with:
          lua-version: '5.4'

      - name: Install luafmt
        run: |
          luarocks install luafmt 2>/dev/null || true

      - name: Lua format check
        run: |
          out=$$(luafmt -c core/ X/ scripts/ 2>/dev/null || true)
          if [ -n "$$out" ]; then
            echo "not lua-formatted:"
            echo "$$out"
            exit 1
          fi
          echo "Lua formatting OK"

      - name: Validate project structure
        run: |
          lua scripts/validate.lua
          echo "Validation passed"

  # Job 2: regenerate manifest
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Lua
        uses: lua/setup-lua@v2
        with:
          lua-version: '5.4'

      - name: Generate manifest
        run: |
          lua scripts/generate-manifest.lua
          echo "Manifest generated"

  # Job 3: smoke test
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Lua
        uses: lua/setup-lua@v2
        with:
          lua-version: '5.4'

      - name: Validate project
        run: lua scripts/validate.lua

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: lua scripts/plugin-list.lua

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: lua scripts/plugin-list.lua
